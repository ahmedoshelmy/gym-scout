# Serves the SPA and proxies the API to the Spring Boot service.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location = /actuator/health {
        proxy_pass http://api:8080;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
