spring.application.name=gym-scout
spring.threads.virtual.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gymscout}
spring.datasource.username=${DATABASE_USER:gymscout}
spring.datasource.password=${DATABASE_PASSWORD:gymscout}
spring.datasource.hikari.maximum-pool-size=10

# Module events (SessionLogged): transactional outbox in Postgres, retried after a crash.
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.completion-mode=delete
spring.modulith.events.republish-outstanding-events-on-restart=true

spring.mvc.problemdetails.enabled=true
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info,metrics,prometheus,modulith
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/api/openapi

# "Today" (visits, weekly volume, cost per visit) is computed in this zone, independent of the host TZ.
gymscout.zone=${GYMSCOUT_ZONE:Africa/Cairo}

# Seed invented Cairo gyms into an empty database.
gymscout.demo-data=${GYMSCOUT_DEMO_DATA:true}
# synthetic (default, offline) | overpass (OpenStreetMap, live)
gymscout.places.source=${GYMSCOUT_PLACES_SOURCE:synthetic}
gymscout.places.overpass-url=${OVERPASS_URL:https://overpass-api.de/api/interpreter}
# straight-line (default, offline) | osrm (public demo server, live)
gymscout.routing.source=${GYMSCOUT_ROUTING_SOURCE:straight-line}
gymscout.routing.osrm-url=${OSRM_URL:https://router.project-osrm.org}
gymscout.outbound.user-agent=gym-scout-demo
